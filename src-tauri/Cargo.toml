[package]
name = "rnote"
version = "0.2.0"
description = "Quick-capture notes, centralized"
authors = ["you"]
edition = "2021"
default-run = "rnote"

[lib]
name = "rnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2"
parking_lot = "0.12.5"
notify-debouncer-full = "0.7.0"
tiny_http = "0.12"
chrono = { version = "0.4", features = ["clock"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
# `Window::hwnd()` returns this crate's HWND (not windows-sys's) — same
# representation, different type, so both crates are needed side by side.
windows = { version = "0.61", features = ["Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
